
name: Cypress Tests

on:
  push:
    branches:
      - clean-code
  pull_request:
    branches:
      - clean-code
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el proyecto
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Descargar OpenCart
      - name: Checkout OpenCart
        uses: actions/checkout@v4
        with:
          repository: opencart/opencart
          ref: 4.1.0.3
          path: opencart

      # 3. Descargar la copia privada de la base de datos
      - name: Checkout database backup
        uses: actions/checkout@v4
        with:
          repository: f36fll0/opencart.sql.gz
          token: ${{ secrets.OPENCART_DB_TOKEN }}
          path: db-backup
          persist-credentials: false

      # 4. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 5. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 6. Crear configuración de OpenCart
      - name: Configure OpenCart
        run: |
          cat > opencart/upload/config.php <<'EOF'
          <?php
          // HTTP
          define('HTTP_SERVER', 'http://localhost/');

          // DIR
          define('DIR_APPLICATION', '/var/www/html/catalog/');
          define('DIR_SYSTEM', '/var/www/html/system/');
          define('DIR_IMAGE', '/var/www/html/image/');
          define('DIR_STORAGE', '/var/www/html/system/storage/');
          define('DIR_LANGUAGE', DIR_APPLICATION . 'language/');
          define('DIR_TEMPLATE', DIR_APPLICATION . 'view/template/');
          define('DIR_CONFIG', DIR_SYSTEM . 'config/');
          define('DIR_CACHE', DIR_STORAGE . 'cache/');
          define('DIR_DOWNLOAD', DIR_STORAGE . 'download/');
          define('DIR_LOGS', DIR_STORAGE . 'logs/');
          define('DIR_SESSION', DIR_STORAGE . 'session/');
          define('DIR_UPLOAD', DIR_STORAGE . 'upload/');

          // DB
          define('DB_DRIVER', 'mysqli');
          define('DB_HOSTNAME', 'mysql');
          define('DB_USERNAME', 'opencart');
          define('DB_PASSWORD', 'opencart');
          define('DB_DATABASE', 'opencart');
          define('DB_PORT', '3306');
          define('DB_PREFIX', 'oc_');
          EOF

          cat > opencart/upload/admin/config.php <<'EOF'
          <?php
          // HTTP
          define('HTTP_SERVER', 'http://localhost/admin/');
          define('HTTP_CATALOG', 'http://localhost/');

          // DIR
          define('DIR_APPLICATION', '/var/www/html/admin/');
          define('DIR_SYSTEM', '/var/www/html/system/');
          define('DIR_IMAGE', '/var/www/html/image/');
          define('DIR_STORAGE', '/var/www/html/system/storage/');
          define('DIR_CATALOG', '/var/www/html/catalog/');
          define('DIR_LANGUAGE', DIR_APPLICATION . 'language/');
          define('DIR_TEMPLATE', DIR_APPLICATION . 'view/template/');
          define('DIR_CONFIG', DIR_SYSTEM . 'config/');
          define('DIR_CACHE', DIR_STORAGE . 'cache/');
          define('DIR_DOWNLOAD', DIR_STORAGE . 'download/');
          define('DIR_LOGS', DIR_STORAGE . 'logs/');
          define('DIR_SESSION', DIR_STORAGE . 'session/');
          define('DIR_UPLOAD', DIR_STORAGE . 'upload/');

          // DB
          define('DB_DRIVER', 'mysqli');
          define('DB_HOSTNAME', 'mysql');
          define('DB_USERNAME', 'opencart');
          define('DB_PASSWORD', 'opencart');
          define('DB_DATABASE', 'opencart');
          define('DB_PORT', '3306');
          define('DB_PREFIX', 'oc_');
          EOF

      # 7. Iniciar MySQL
      - name: Start MySQL
        run: docker compose -f docker/docker-compose.yml up -d mysql

      # 8. Esperar a que MySQL esté disponible
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.yml exec -T mysql \
              mysqladmin ping -h 127.0.0.1 -u root -popencart --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 5
          done
          echo "MySQL did not become ready"
          exit 1

      # 9. Restaurar la base de datos
      - name: Restore OpenCart database
        run: |
          tar -xOzf db-backup/opencart.sql.gz opencart.sql | \
            docker compose -f docker/docker-compose.yml exec -T mysql \
            mysql --binary-mode=1 -u root -popencart opencart

      # 10. Eliminar el instalador
      - name: Remove OpenCart installer
        run: rm -rf opencart/upload/install

      # 11. Iniciar OpenCart
      - name: Start OpenCart
        run: docker compose -f docker/docker-compose.yml up -d opencart

      # 12. Esperar a que OpenCart esté disponible
      - name: Wait for OpenCart
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost/ > /dev/null; then
              echo "OpenCart is ready"
              exit 0
            fi
            sleep 5
          done
          echo "OpenCart did not become ready"
          exit 1

      # 13. Ejecutar los tests
      - name: Run Cypress tests
        run: npx cypress run

      # 14. Subir vídeos y capturas
      - name: Upload Cypress videos and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            cypress/videos/
            cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # 15. Mostrar logs si falla la ejecución
      - name: Docker logs
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml logs

      # 16. Limpiar contenedores
      - name: Stop containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
